[paths]
# All paths may be absolute or relative to this crossas.ini file.
resource_dir = ./resources
result_dir = ./results

[genomes]
human = ./resources/genomes/hg38.fa.gz
pig = ./resources/genomes/Sus_scrofa.Sscrofa11.1.dna.toplevel.fa.gz

[models]
human-promoter = ./resources/fine_turned_models/human_promoter/pytorch_model.bin
human-enhancer = ./resources/fine_turned_models/human_enhancer/pytorch_model.bin
pig-promoter = ./resources/fine_turned_models/pig_promoter/pytorch_model.bin
pig-enhancer = ./resources/fine_turned_models/pig_enhancer/pytorch_model.bin